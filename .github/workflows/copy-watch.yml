name: copy-watch

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue instead of opening it
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: copy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the job commits and pushes the seen list
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --test scripts/copy-watch.test.mjs
      - name: Search for copies
        run: node scripts/copy-watch.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_TOKEN: ${{ secrets.COPY_WATCH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit seen list
        run: |
          git add copy-watch/seen.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(copy-watch): record reported repositories"
          git pull --rebase
          git push
